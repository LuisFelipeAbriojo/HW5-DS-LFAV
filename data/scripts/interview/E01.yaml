id: E01
task: interview
reference_date: "2026-10-26"
variacion: >
  Orden: experiencia, puesto, tecnologías, inglés, disponibilidad, salario (al final).
  Trampas: "hace como cinco años" antes del valor real (4); salario actual (5800) y un
  "seis mil" a medias antes de la cifra final (6500).
ground_truth:
  anios_experiencia: 4
  ultimo_puesto: analista de inteligencia comercial
  tecnologias: [SQL, Python, Pandas, Power BI]
  pretension_salarial: 6500
  moneda: PEN
  disponibilidad: "2026-11-09"
  nivel_ingles: intermedio
turns:
  - A: "Buenas tardes, gracias por conectarte. Soy Mateo, del equipo de selección de Andina Retail. Esta entrevista es para el puesto de analista de datos senior. ¿Me escuchas bien?"
  - B: "Sí, te escucho perfecto. Buenas tardes, Mateo."
  - A: "Genial. Para empezar, cuéntame un poco de tu trayectoria. ¿Cuánto tiempo llevas trabajando con datos?"
  - B: "Mira, empecé en el área de reportes recién egresado. Eso fue hace, a ver, hace como cinco años, pero el primer año fue más de practicante. Entonces, formalmente, diría que tengo cuatro años de experiencia."
  - A: "Perfecto. ¿Y dónde estás trabajando ahora?"
  - B: "Ahora estoy en una distribuidora de consumo masivo. Mi último puesto es analista de inteligencia comercial y reporto directamente a la gerencia de ventas."
  - A: "¿Cómo es un día típico para ti?"
  - B: "Bastante extracción y limpieza. Armo las consultas en SQL contra el almacén de datos, luego hago la transformación en Python, sobre todo con Pandas, y al final todo termina en tableros de Power BI que revisan los jefes regionales cada lunes."
  - A: "¿Y has trabajado con alguna nube?"
  - B: "Muy poco, la verdad, no lo pondría como fortaleza. Lo mío es más la parte analítica, entender el negocio y que el número cuadre con lo que ve ventas."
  - A: "Entendido. El equipo trabaja con proveedores de Estados Unidos. ¿Cómo andas de inglés?"
  - B: "Leo documentación sin problema y escribo correos. Para conversar me defiendo; yo diría que estoy en un nivel intermedio. Ahorita estoy llevando un curso los sábados para mejorar la parte oral."
  - A: "Bien. ¿Y en cuanto a disponibilidad? Si todo sale bien, ¿cuándo podrías empezar?"
  - B: "Tendría que avisar en mi trabajo. Lo justo es dar dos semanas, así que podría incorporarme en dos semanas desde hoy."
  - A: "Perfecto. Última pregunta, la incómoda. ¿Cuál es tu pretensión salarial?"
  - B: "Ahorita gano cinco mil ochocientos. Estaba pensando en seis mil, no, mira, siendo realista por el cargo senior, seis mil quinientos soles mensuales."
  - A: "Seis mil quinientos brutos, anotado. ¿Tienes alguna pregunta para mí?"
  - B: "Sí, quería saber si el puesto es remoto o híbrido."
  - A: "Es híbrido, dos días a la semana en la oficina de San Isidro. Te escribimos esta semana con los siguientes pasos."
  - B: "Perfecto, muchas gracias."
  - A: "Gracias a ti. Que tengas buena tarde."
